<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Camera Path Viewer</title>
    <script>
      if (window.location.protocol === "file:") {
        window.location.replace("http://127.0.0.1:8767/camera-path-lab.html");
      }
    </script>
    <link rel="stylesheet" href="./camera-path-lab.css" />
  </head>
  <body>
    <main class="lab-stage">
      <div id="lab-canvas" aria-label="3D camera path visualization"></div>

      <header class="app-bar">
        <span class="app-name">CAMERA PATH</span>
        <span class="bar-divider"></span>
        <strong id="map-name">Video Map 20:07:46 Copy</strong>
        <span class="bar-spacer"></span>
        <span id="status-dot" class="status-dot idle"></span>
        <span id="status-text">Ready</span>
      </header>

      <div id="camera-label" class="camera-label" hidden>
        <span id="coordinate-kicker" class="coordinate-kicker">LIVE CAMERA POSITION</span>
        <strong id="camera-coordinates">X 0.000 · Y 0.000 · Z 0.000</strong>
      </div>
      <svg id="coordinate-link" class="coordinate-link" aria-hidden="true" hidden>
        <defs>
          <filter id="coordinate-glow" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
        </defs>
        <path id="coordinate-link-path" class="coordinate-link-path"></path>
        <circle id="coordinate-camera-ring" class="coordinate-camera-ring" r="8"></circle>
        <circle id="coordinate-camera-dot" class="coordinate-camera-dot" r="2.5"></circle>
        <circle id="coordinate-label-dot" class="coordinate-label-dot" r="3"></circle>
      </svg>

      <aside class="video-card" aria-label="Synchronized source video">
        <div class="video-frame">
          <video id="source-video" muted playsinline preload="metadata"></video>
          <div id="video-empty" class="video-empty">Choose a video</div>
          <div id="frame-chip" class="frame-chip">FRAME —</div>
        </div>
        <div class="video-caption">
          <span id="video-time">00:00.0</span>
          <span id="detail-text">Waiting for video</span>
        </div>
      </aside>

      <div class="run-bar">
        <label class="file-button" for="video-input">
          <input id="video-input" type="file" accept="video/mp4,video/quicktime,video/*" />
          <span id="file-name">Choose video</span>
        </label>
        <button id="start-button" class="run-button" type="button" disabled>Run</button>
        <button id="stop-button" class="stop-button" type="button" disabled>Stop</button>
        <button id="replay-button" class="replay-button" type="button" disabled>Replay</button>
        <div class="progress-track"><span id="progress-fill"></span></div>
        <span class="pose-count"><strong id="accepted-count">0</strong>/<span id="processed-count">0</span></span>
        <span id="target-count" class="target-count">0</span>
      </div>

      <div class="view-controls" aria-label="3D view controls">
        <button id="reset-view" type="button">Reset</button>
        <button id="top-view" type="button">Top</button>
        <button id="toggle-walls" type="button" aria-pressed="true">Walls</button>
      </div>

      <div id="mesh-badge" class="mesh-badge">Loading mesh…</div>
    </main>
    <script type="module" src="./camera-path-lab.js?v=20260802-elevated-callout"></script>
  </body>
</html>
